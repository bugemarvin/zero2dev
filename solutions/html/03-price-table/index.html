<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Plans</title>
</head>
<body>
  <h1>Plans</h1>
  <table>
    <caption>Monthly plans</caption>
    <thead>
      <tr>
        <th scope="col">Plan</th>
        <th scope="col">Price</th>
        <th scope="col">Storage</th>
      </tr>
    </thead>
    <tbody>
      <tr>
        <th scope="row">Basic</th>
        <td>$5</td>
        <td>10 GB</td>
      </tr>
      <tr>
        <th scope="row">Pro</th>
        <td>$12</td>
        <td>100 GB</td>
      </tr>
      <tr>
        <th scope="row">Team</th>
        <td>$30</td>
        <td>1 TB</td>
      </tr>
    </tbody>
  </table>
</body>
</html>
